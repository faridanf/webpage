footer.skewed-footer {
  position: relative;
  height: 50px; /* Adjust height as needed */
  width: 100%;
  background-color: #010309; /* UBC blue */
  overflow: hidden; /* Ensures the skewed element stays within the footer */
}

footer.skewed-footer::after {
  content: "";
  position: absolute;
  top: 100;
  right: 0;
  width: 20%;
  height: 100%;
  background-color: inherit; /* Inherits the blue color */
  transform: skewX(-45deg); /* Applies the skew to the right */
  z-index: -1; /* Ensures the skewed element appears behind the links */
}

.footer-content {

}

  color: #fff;  /* White text */
   text-decoration: none;  /* Removes underline */
