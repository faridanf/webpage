<!DOCTYPE html>
<html>
<head>
    <title>Nested Progress Tracker</title>
    <style>
        .part, .subpart { 
            margin: 10px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            position: relative;
        }
        .part { background-color: #f8f9fa; }
        .subpart { background-color: #e9ecef; margin-left: 30px; }
        .completed { background-color: #d4edda; }
        #progressBar { width: 100%; background-color: #e0e0e0; }
        #progressFill { height: 20px; background-color: #4CAF50; width: 0%; }
        .part-actions, .subpart-actions { margin-top: 8px; }
        .collapse-btn { 
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>My Nested Progress Tracker</h1>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <p>Completion: <span id="percent">0</span>% (<span id="completedCount">0</span>/<span id="totalCount">0</span> items)</p>
    
    <div id="partsContainer">
        <!-- Parts and subparts will be added here -->
    </div>
    
    <button onclick="addPart()">Add New Main Part</button>
    
    <script>
        let items = [];
        
        function addPart() {
            const partName = prompt("Enter part name:");
            if (partName) {
                const part = {
                    id: Date.now(),
                    name: partName,
                    type: 'part',
                    completed: false,
                    collapsed: false,
                    subparts: []
                };
                items.push(part);
                renderItems();
            }
        }
        
        function addSubpart(partId) {
            const part = items.find(p => p.id === partId);
            if (part) {
                const subpartName = prompt("Enter subpart name:");
                if (subpartName) {
                    const subpart = {
                        id: Date.now(),
                        name: subpartName,
                        type: 'subpart',
                        completed: false,
                        parentId: partId
                    };
                    part.subparts.push(subpart);
                    renderItems();
                }
            }
        }
        
        function toggleComplete(itemId) {
            // Find item (could be part or subpart)
            let item = null;
            let parentPart = null;
            
            // Check main parts first
            item = items.find(p => p.id === itemId);
            
            // If not found in main parts, check subparts
            if (!item) {
                for (const part of items) {
                    const subpart = part.subparts.find(sp => sp.id === itemId);
                    if (subpart) {
                        item = subpart;
                        parentPart = part;
                        break;
                    }
                }
            }
            
            if (item) {
                item.completed = !item.completed;
                
                // If this is a part, update all subparts if marking complete
                if (item.type === 'part' && item.completed) {
                    item.subparts.forEach(sp => sp.completed = true);
                }
                
                // If this is a subpart, check if parent part should be complete
                if (item.type === 'subpart' && parentPart) {
                    const allSubpartsComplete = parentPart.subparts.every(sp => sp.completed);
                    if (allSubpartsComplete) {
                        parentPart.completed = true;
                    } else {
                        parentPart.completed = false;
                    }
                }
                
                updateProgress();
                renderItems();
            }
        }
        
        function toggleCollapse(partId) {
            const part = items.find(p => p.id === partId);
            if (part) {
                part.collapsed = !part.collapsed;
                renderItems();
            }
        }
        
        function deleteItem(itemId) {
            // Try to find in main items first
            const itemIndex = items.findIndex(p => p.id === itemId);
            if (itemIndex !== -1) {
                items.splice(itemIndex, 1);
            } else {
                // If not found, search in subparts
                for (const part of items) {
                    const subpartIndex = part.subparts.findIndex(sp => sp.id === itemId);
                    if (subpartIndex !== -1) {
                        part.subparts.splice(subpartIndex, 1);
                        
                        // Update parent completion status if needed
                        if (part.subparts.length === 0) {
                            part.completed = false;
                        }
                        break;
                    }
                }
            }
            updateProgress();
            renderItems();
        }
        
        function updateProgress() {
            // Flatten all items and subitems
            const allItems = [];
            items.forEach(part => {
                allItems.push(part);
                part.subparts.forEach(subpart => allItems.push(subpart));
            });
            
            const completed = allItems.filter(i => i.completed).length;
            const total = allItems.length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('percent').textContent = percent;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
        }
        
        function renderItems() {
            const container = document.getElementById('partsContainer');
            container.innerHTML = '';
            
            items.forEach(part => {
                const partDiv = document.createElement('div');
                partDiv.className = `part ${part.completed ? 'completed' : ''}`;
                partDiv.innerHTML = `
                    <span class="collapse-btn" onclick="toggleCollapse(${part.id})">
                        ${part.collapsed ? '⊕' : '⊖'}
                    </span>
                    <h3>${part.name}</h3>
                    <div class="part-actions">
                        <button onclick="toggleComplete(${part.id})">
                            ${part.completed ? '✓ Completed' : 'Mark Complete'}
                        </button>
                        <button onclick="addSubpart(${part.id})">Add Subpart</button>
                        <button onclick="deleteItem(${part.id})">Delete</button>
                    </div>
                    <div id="subparts-${part.id}"></div>
                `;
                container.appendChild(partDiv);
                
                // Render subparts if not collapsed
                const subpartsContainer = document.getElementById(`subparts-${part.id}`);
                if (!part.collapsed) {
                    part.subparts.forEach(subpart => {
                        const subpartDiv = document.createElement('div');
                        subpartDiv.className = `subpart ${subpart.completed ? 'completed' : ''}`;
                        subpartDiv.innerHTML = `
                            <h4>${subpart.name}</h4>
                            <div class="subpart-actions">
                                <button onclick="toggleComplete(${subpart.id})">
                                    ${subpart.completed ? '✓ Completed' : 'Mark Complete'}
                                </button>
                                <button onclick="deleteItem(${subpart.id})">Delete</button>
                            </div>
                        `;
                        subpartsContainer.appendChild(subpartDiv);
                    });
                }
            });
            
            updateProgress();
        }
    </script>
</body>
</html>
