<!DOCTYPE html>
<html>
<head>
    <title>Advanced Progress Tracker</title>
    <style>
        .part, .subpart { 
            margin: 10px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            position: relative;
        }
        .part { background-color: #f8f9fa; }
        .subpart { background-color: #e9ecef; margin-left: 20px; }
        .completed { background-color: #d4edda; }
        #progressBar { width: 100%; background-color: #e0e0e0; }
        #progressFill { height: 20px; background-color: #4CAF50; width: 0%; }
        .details { display: none; margin-top: 10px; padding: 10px; background: white; border: 1px dashed #aaa; }
        .part-actions, .subpart-actions { margin-top: 5px; }
        button { margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Advanced Progress Tracker</h1>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <p>Completion: <span id="percent">0</span>% (<span id="completedCount">0</span>/<span id="totalCount">0</span> items)</p>
    
    <div id="partsContainer">
        <!-- Parts will be added here -->
    </div>
    
    <button onclick="addPart()">Add New Main Part</button>
    <button onclick="saveData()">Save All Data</button>
    <button onclick="loadData()">Load Saved Data</button>
    
    <script>
        let parts = [];
        
        // Add a new main part
        function addPart(parentId = null) {
            const partName = prompt("Enter part name:");
            if (partName) {
                const part = {
                    id: Date.now(),
                    parentId: parentId,
                    name: partName,
                    completed: false,
                    details: "",
                    subparts: [],
                    lastEdited: new Date().toISOString()
                };
                
                if (parentId) {
                    const parent = findPart(parentId);
                    if (parent) parent.subparts.push(part);
                } else {
                    parts.push(part);
                }
                
                renderParts();
            }
        }
        
        // Find part by ID (including subparts)
        function findPart(partId, partList = parts) {
            for (const part of partList) {
                if (part.id === partId) return part;
                if (part.subparts && part.subparts.length > 0) {
                    const found = findPart(partId, part.subparts);
                    if (found) return found;
                }
            }
            return null;
        }
        
        // Toggle completion status
        function toggleComplete(partId) {
            const part = findPart(partId);
            if (part) {
                part.completed = !part.completed;
                part.lastEdited = new Date().toISOString();
                updateProgress();
                renderParts();
            }
        }
        
        // Edit part details
        function editPart(partId) {
            const part = findPart(partId);
            if (part) {
                const newName = prompt("Edit part name:", part.name);
                if (newName !== null) {
                    part.name = newName;
                    const newDetails = prompt("Edit details/report:", part.details);
                    if (newDetails !== null) part.details = newDetails;
                    part.lastEdited = new Date().toISOString();
                    renderParts();
                }
            }
        }
        
        // Delete part
        function deletePart(partId) {
            if (confirm("Are you sure you want to delete this part and all its subparts?")) {
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].id === partId) {
                        parts.splice(i, 1);
                        renderParts();
                        return;
                    }
                    if (parts[i].subparts && parts[i].subparts.length > 0) {
                        deleteSubpart(parts[i].subparts, partId);
                    }
                }
            }
        }
        
        function deleteSubpart(subparts, partId) {
            for (let i = 0; i < subparts.length; i++) {
                if (subparts[i].id === partId) {
                    subparts.splice(i, 1);
                    renderParts();
                    return;
                }
                if (subparts[i].subparts && subparts[i].subparts.length > 0) {
                    deleteSubpart(subparts[i].subparts, partId);
                }
            }
        }
        
        // Toggle details visibility
        function toggleDetails(partId) {
            const detailsDiv = document.getElementById(`details-${partId}`);
            if (detailsDiv) {
                detailsDiv.style.display = detailsDiv.style.display === 'block' ? 'none' : 'block';
            }
        }
        
        // Calculate progress
        function updateProgress() {
            const { completed, total } = calculateCompletion(parts);
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('percent').textContent = percent;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
        }
        
        // Recursive completion calculation
        function calculateCompletion(partList) {
            let completed = 0;
            let total = 0;
            
            for (const part of partList) {
                total++;
                if (part.completed) completed++;
                
                if (part.subparts && part.subparts.length > 0) {
                    const sub = calculateCompletion(part.subparts);
                    completed += sub.completed;
                    total += sub.total;
                }
            }
            
            return { completed, total };
        }
        
        // Render all parts
        function renderParts() {
            const container = document.getElementById('partsContainer');
            container.innerHTML = '';
            
            function renderPartList(partList, isSubpart = false) {
                partList.forEach(part => {
                    const partDiv = document.createElement('div');
                    partDiv.className = `${isSubpart ? 'subpart' : 'part'} ${part.completed ? 'completed' : ''}`;
                    
                    partDiv.innerHTML = `
                        <h3>${part.name} 
                            <small>${new Date(part.lastEdited).toLocaleString()}</small>
                            ${part.subparts.length > 0 ? `<span style="float:right">${part.subparts.filter(sp => sp.completed).length}/${part.subparts.length} subparts</span>` : ''}
                        </h3>
                        <div class="${isSubpart ? 'subpart-actions' : 'part-actions'}">
                            <button onclick="toggleComplete(${part.id})">
                                ${part.completed ? '✓ Completed' : 'Mark Complete'}
                            </button>
                            <button onclick="editPart(${part.id})">Edit</button>
                            <button onclick="deletePart(${part.id})">Delete</button>
                            <button onclick="addPart(${part.id})">Add Subpart</button>
                            <button onclick="toggleDetails(${part.id})">Details</button>
                        </div>
                        <div id="details-${part.id}" class="details">
                            <h4>Details/Report</h4>
                            <p>${part.details || 'No details added yet.'}</p>
                            <textarea id="details-text-${part.id}" rows="4" style="width:100%">${part.details}</textarea>
                            <button onclick="saveDetails(${part.id})">Save Details</button>
                        </div>
                    `;
                    
                    container.appendChild(partDiv);
                    
                    if (part.subparts && part.subparts.length > 0) {
                        renderPartList(part.subparts, true);
                    }
                });
            }
            
            renderPartList(parts);
            updateProgress();
        }
        
        // Save details
        function saveDetails(partId) {
            const part = findPart(partId);
            const textarea = document.getElementById(`details-text-${partId}`);
            if (part && textarea) {
                part.details = textarea.value;
                part.lastEdited = new Date().toISOString();
                renderParts();
            }
        }
        
        // Save data to localStorage
        function saveData() {
            localStorage.setItem('progressTrackerData', JSON.stringify(parts));
            alert('Data saved successfully!');
        }
        
        // Load data from localStorage
        function loadData() {
            const savedData = localStorage.getItem('progressTrackerData');
            if (savedData) {
                parts = JSON.parse(savedData);
                renderParts();
                alert('Data loaded successfully!');
            } else {
                alert('No saved data found!');
            }
        }
        
        // Initialize
        renderParts();
    </script>
</body>
</html>
